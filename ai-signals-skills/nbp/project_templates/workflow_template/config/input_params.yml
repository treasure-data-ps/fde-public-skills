#####################################################################
########################## GLOBAL PARAMS ############################
#####################################################################

# ── Output ─────────────────────────────────────────────────────────
sink_database: <sink_database>                      # where output tables will be stored
prefix: 'nbp_'                                # prefix for all intermediate/output tables
user_master_attr_table: nbp_user_master       # final attribute table with per-rank recommendation columns
cleanup_temp_tables: no                       # 'yes' to drop temp tables after run

# ── Model Type ─────────────────────────────────────────────────────
model_type: 'automl'
automl_model_type: similar_to_latest          # recency-weighted recommendations
ml_batch_api_endpoint: 'https://ml-batch-api.treasuredata.com'  # aws site
als_sample_rate: 1.0                          # 737 users — no sampling needed
als_max_users: 100000
filter_viewed: false

#####################################################################
########################## INPUT PARAMS #############################
#####################################################################

# ── Source Tables ──────────────────────────────────────────────────
in_db: <source_database>
original_item_transactions_table: transactions_items
original_item_info_table: transactions_items  # same table — item_name/item_category present

# ── Column Mappings ────────────────────────────────────────────────
original_user_id_column_name: customer_id
original_item_id_column_name: item_sku
original_item_name_column_name: item_name
original_item_category_column_name: item_category
original_timestamp_name: time

# ── Time Filter ────────────────────────────────────────────────────
orders_lookback: ''                           # all history (no customer constraint specified)

#####################################################################
######################## EXCLUSION FILTERS ##########################
#####################################################################

transaction_filter: ''

# ── Pre-model exclusion (removes items from training data) ─────────
exclude_product_train: no                     # no exclusions for minimal push
exclusion_column: item                        # column to match against (ignored if exclusion_values is 'query')
exclusion_values: query                       # regex string, or 'query' to use filter_products_training_query.sql

# ── Post-model exclusion (removes items from recommendation output) ─
exclude_product_recs: no
recs_exclusion_column: item_name              # column to match against (ignored if recs_exclusion_values is 'query')
recs_exclusion_values: ''                     # regex string, or 'query' to use filter_products_recs_query.sql

#####################################################################
################### HIVE ENGINE PARAMETERS ##########################
#####################################################################
# Ignored — model_type = automl

topk_similar_items: 3
recent_items: 1
max_recommended_items: 5
min_cooccurence_filter: 1
dimsum_similarity_threshold: 0.25

#####################################################################
################### MODEL EVALUATION ################################
#####################################################################

run_model_test_set: yes
test_params:
  test_lookback: 30d
